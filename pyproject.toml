[project]
name = "protocol-check"
version = "0.1.0"
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.21",
    "openai>=1.0",
    "tqdm>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "checks*",
    "domain*",
    "engine*",
    "parsing*",
    "reporting*",
    "services*",
]
exclude = [
    "tests*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
